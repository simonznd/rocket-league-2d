<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket League 2D</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="game-container"></div>

    <div id="touch-controls" aria-label="Contrôles tactiles">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>

      <div id="left-buttons" class="button-cluster">
        <button id="accel-btn" class="touch-btn">Accel</button>
        <button id="brake-btn" class="touch-btn">Brake</button>
      </div>

      <div id="right-buttons" class="button-cluster">
        <button id="jump-btn" class="touch-btn action-btn">Jump</button>
        <button id="boost-btn" class="touch-btn action-btn">Turbo</button>
      </div>

      <div id="hud-buttons">
        <button id="pause-btn" class="hud-btn">Pause</button>
        <button id="restart-btn" class="hud-btn alt">Reset</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
